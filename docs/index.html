<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELOPEP · Sprint 1</title>
<style>
  :root{
    --paper:#EDEFEA;
    --paper-raised:#F7F8F5;
    --ink:#1E2521;
    --ink-soft:#565F58;
    --ink-faint:#8B9188;
    --line:#D2D6CC;
    --line-strong:#B7BCAF;
    --accent:#2F5D50;
    --accent-soft:#DCE6E1;
    --backlog:#8A8A82;
    --backlog-bg:#EAEAE5;
    --selected:#4C6B8A;
    --selected-bg:#E1E9F0;
    --progress:#B8791D;
    --progress-bg:#F4E7D2;
    --done:#2F7A56;
    --done-bg:#DEEBE3;
    --danger:#B23A2E;
    --danger-bg:#F5E1DE;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    padding:2.5rem 1.5rem 5rem;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:1rem;
    border-bottom:2px solid var(--ink);
    padding-bottom:1.1rem;
    margin-bottom:1.6rem;
  }
  .eyebrow{
    font-family:"IBM Plex Mono", "SFMono-Regular", Menlo, monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 .35rem;
  }
  h1{
    font-family:Georgia,"Iowan Old Style","Times New Roman",serif;
    font-weight:600;
    font-size:32px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .updated{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--ink-faint);
    text-align:right;
  }
  .updated-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem;}
  .refresh-btn{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:.35rem .7rem;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .refresh-btn:hover{color:var(--accent);border-color:var(--accent);}

  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:2rem;
  }
  .stat{
    background:var(--paper-raised);
    padding:1rem 1.15rem;
  }
  .stat .label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:0 0 .4rem;
  }
  .stat .value{
    font-family:"IBM Plex Mono", monospace;
    font-size:24px;
    font-weight:600;
    margin:0;
  }
  .stat .sub{font-size:12px;color:var(--ink-faint);margin-top:.25rem;}

  .tabs{
    display:flex;
    gap:0;
    border-bottom:1px solid var(--line-strong);
    margin-bottom:1.6rem;
    flex-wrap:wrap;
  }
  .tab{
    font-family:"IBM Plex Mono",monospace;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:.6rem 1rem;
    border:none;
    background:transparent;
    color:var(--ink-faint);
    cursor:pointer;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .sprint-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:2.2rem;
  }
  .sprint-card{
    background:var(--paper-raised);
    padding:1rem 1.15rem;
    cursor:pointer;
  }
  .sprint-card:hover{background:var(--accent-soft);}
  .sprint-card .sname{font-size:13px;font-weight:600;margin:0 0 .5rem;}
  .sprint-card .sbar{height:8px;background:var(--paper);border:1px solid var(--line);margin-bottom:.5rem;overflow:hidden;}
  .sprint-card .sbar-fill{height:100%;background:var(--done);}
  .sprint-card .smeta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-soft);display:flex;justify-content:space-between;}
  .sprint-card.empty-sprint{opacity:.55;}

  .status-row{
    display:flex;
    align-items:center;
    gap:.6rem;
    margin-bottom:1.2rem;
    flex-wrap:wrap;
  }
  .status-pill{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:.35rem .7rem;
    border:1px solid var(--line-strong);
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .status-pill .dot{width:8px;height:8px;border-radius:50%;}
  .status-pill.ok{border-color:var(--done);color:var(--done);}
  .status-pill.ok .dot{background:var(--done);}
  .status-pill.warn{border-color:var(--progress);color:var(--progress);}
  .status-pill.warn .dot{background:var(--progress);}
  .status-pill.risk{border-color:var(--danger);color:var(--danger);}
  .status-pill.risk .dot{background:var(--danger);}
  .status-detail{font-size:12.5px;color:var(--ink-soft);}

  .insight{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    padding:.85rem 1rem;
    margin-bottom:2rem;
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
  }
  .insight b{color:var(--accent);}
  .insight .tag{
    font-family:"IBM Plex Mono",monospace;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--accent);
    display:block;
    margin-bottom:.35rem;
  }

  section.block{margin-bottom:2.2rem;}
  .block-title{
    font-family:Georgia, serif;
    font-size:15px;
    font-weight:600;
    margin:0 0 .8rem;
    display:flex;
    align-items:baseline;
    gap:.5rem;
  }
  .block-title .n{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);}

  .workload{display:flex;flex-direction:column;gap:10px;}
  .wl-row{display:grid;grid-template-columns:160px 1fr 64px;align-items:center;gap:12px;}
  .wl-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .wl-bar{height:16px;background:var(--paper-raised);border:1px solid var(--line);display:flex;overflow:hidden;}
  .wl-seg{height:100%;}
  .wl-total{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);text-align:right;}

  .legend{display:flex;gap:1.2rem;flex-wrap:wrap;margin-top:.7rem;font-size:11px;color:var(--ink-soft);}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;display:inline-block;}

  .controls{
    display:flex;
    gap:.6rem;
    flex-wrap:wrap;
    margin-bottom:1.1rem;
  }
  .controls input, .controls select{
    font-family:inherit;
    font-size:13px;
    padding:.5rem .65rem;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    color:var(--ink);
  }
  .controls input{flex:1;min-width:160px;}
  .view-toggle{display:flex;border:1px solid var(--ink);margin-left:auto;}
  .view-toggle button{
    font-family:"IBM Plex Mono",monospace;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:.5rem .9rem;
    border:none;
    background:var(--paper-raised);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .view-toggle button.active{background:var(--ink);color:var(--paper);}

  .board{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;
  }
  .col{background:var(--paper-raised);border:1px solid var(--line);min-height:60px;}
  .col-head{
    padding:.7rem .85rem;
    border-bottom:2px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .col-head .name{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;}
  .col-head .count{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);}
  .col-body{padding:.6rem;display:flex;flex-direction:column;gap:.5rem;}

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--line-strong);
    padding:.65rem .75rem;
    cursor:default;
  }
  .card .key{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-faint);margin-bottom:.25rem;}
  .card .summary{font-size:13px;font-weight:600;line-height:1.35;margin-bottom:.5rem;}
  .card-meta{display:flex;justify-content:space-between;align-items:center;}
  .avatar{
    width:22px;height:22px;border-radius:50%;
    background:var(--accent-soft);color:var(--accent);
    font-size:10px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    font-family:"IBM Plex Mono",monospace;
    flex-shrink:0;
  }
  .avatar.unassigned{background:var(--paper-raised);color:var(--ink-faint);border:1px dashed var(--line-strong);}
  .meta-right{display:flex;align-items:center;gap:6px;}
  .prio-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .time-chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-soft);}

  .people{display:flex;flex-direction:column;gap:14px;}
  .person{background:var(--paper-raised);border:1px solid var(--line);}
  .person-head{
    padding:.8rem .95rem;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid var(--line);
  }
  .person-head .avatar{width:30px;height:30px;font-size:12px;}
  .person-head .pname{font-size:14px;font-weight:600;}
  .person-head .pcount{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint);}
  .person-body{padding:.5rem .6rem;display:flex;flex-direction:column;gap:.5rem;}

  .empty{padding:1.2rem;text-align:center;font-size:12px;color:var(--ink-faint);}

  footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);font-family:"IBM Plex Mono",monospace;}

  @media (max-width:820px){
    .board{grid-template-columns:1fr 1fr;}
  }
  @media (max-width:560px){
    .board{grid-template-columns:1fr;}
    .wl-row{grid-template-columns:110px 1fr 50px;}
  }
</style>

<body>
<div class="wrap">

  <header>
    <div>
      <p class="eyebrow">ELOPEP · Pepsi</p>
      <h1 id="pageTitle">Sprint tracker</h1>
    </div>
    <div class="updated-wrap">
      <div class="updated" id="updated"></div>
      <button id="refreshBtn" class="refresh-btn">Refrescar</button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>

  <div id="overviewView">
    <div class="sprint-grid" id="sprintGrid"></div>
  </div>

  <div id="sprintView">
    <div class="status-row" id="statusRow"></div>

    <div class="stats" id="stats"></div>

    <div class="insight" id="insight"></div>

    <section class="block">
      <p class="block-title">Carga por persona <span class="n" id="wl-n"></span></p>
      <div class="workload" id="workload"></div>
      <div class="legend">
        <span><i style="background:var(--backlog)"></i>Backlog</span>
        <span><i style="background:var(--selected)"></i>Selected for development</span>
        <span><i style="background:var(--progress)"></i>In progress</span>
        <span><i style="background:var(--done)"></i>Done</span>
      </div>
    </section>

    <section class="block">
      <div class="controls">
        <input type="text" id="search" placeholder="Buscar por clave, resumen o persona…">
        <select id="filterAssignee"></select>
        <select id="filterPriority">
          <option value="">Toda prioridad</option>
        </select>
        <div class="view-toggle">
          <button id="btnBoard" class="active">Board</button>
          <button id="btnPeople">Por persona</button>
        </div>

      <div class="people" id="people" style="display:none;"></div>
    </section>
  </div>

  <footer id="footerLine"></footer>
</div>

<script>
const SPRINT_SOURCES = {
"Sprint 1": "https://docs.google.com/spreadsheets/d/e/2PACX-1vSWWR5OWlAojMY4J327SiSdUnT9G9GRFFY0F5cGxtB7hIMEBCO27ocWqTWR-hqfntJnbMtfwgwTZLSn/pub?gid=71346236&single=true&output=csv",
"Sprint 2": null,
"Sprint 3": null,
"Sprint 4": null,
};

const SPRINT_NAMES = Object.keys(SPRINT_SOURCES);
const SPRINTS = {};
SPRINT_NAMES.forEach(n => SPRINTS[n] = []);

function parseCSV(text){
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ",") { row.push(field); field = ""; }
      else if(c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r") { /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r.length===1 && r[0] !== ""));
}

function rowsToTasks(rows){
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  const idx = {
    key: headers.indexOf("Issue key"),
    summary: headers.indexOf("Summary"),
    status: headers.indexOf("Status"),
    priority: headers.indexOf("Priority"),
    assignee: headers.indexOf("Assignee"),
    orig: headers.indexOf("Original estimate"),
    remaining: headers.indexOf("Remaining Estimate"),
    spent: headers.indexOf("Time Spent"),
  };
  const num = v => { const n = parseInt(v,10); return isNaN(n) ? 0 : n; };
  return rows.slice(1)
    .filter(r => r[idx.key])
    .map(r => ({
      key: r[idx.key] || "",
      summary: r[idx.summary] || "",
      status: (r[idx.status] || "").trim(),
      priority: (r[idx.priority] || "").trim() || "Medium",
      assignee: (r[idx.assignee] || "").trim() || null,
      orig: num(r[idx.orig]),
      remaining: num(r[idx.remaining]),
      spent: num(r[idx.spent]),
    }));
}

let fetchErrors = {};

function rowsToTasksFromCols(cols, rows){
  const idx = {
    key: cols.indexOf("Issue key"),
    summary: cols.indexOf("Summary"),
    status: cols.indexOf("Status"),
    priority: cols.indexOf("Priority"),
    assignee: cols.indexOf("Assignee"),
    orig: cols.indexOf("Original estimate"),
    remaining: cols.indexOf("Remaining Estimate"),
    spent: cols.indexOf("Time Spent"),
  };
  const num = v => { const n = parseInt(v,10); return isNaN(n) ? 0 : n; };
  return rows
    .filter(r => r[idx.key])
    .map(r => ({
      key: String(r[idx.key] || ""),
      summary: String(r[idx.summary] || ""),
      status: String(r[idx.status] || "").trim(),
      priority: String(r[idx.priority] || "").trim() || "Medium",
      assignee: (r[idx.assignee] ? String(r[idx.assignee]).trim() : "") || null,
      orig: num(r[idx.orig]),
      remaining: num(r[idx.remaining]),
      spent: num(r[idx.spent]),
    }));
}

async function tryFetchText(url){
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("HTTP "+res.status);
  const text = await res.text();
  if(!text || text.trim().length === 0) throw new Error("Respuesta vacía");
  return text;
}

function gvizFallback(name, url){
  return new Promise(resolve=>{
    const cbName = "gvizCb_" + name.replace(/[^a-zA-Z0-9]/g,"") + "_" + Date.now();
    const sep = url.includes("?") ? "&" : "?";
    const fullUrl = url + sep + "tqx=out:json;responseHandler=" + cbName;
    let settled = false;
    const timeout = setTimeout(()=>{ finish(false, "Tiempo de espera agotado"); }, 10000);

    function cleanup(){ delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); clearTimeout(timeout); }
    function finish(ok, errMsg, tasks){
      if(settled) return; settled = true; cleanup();
      if(ok){ resolve(tasks); } else { resolve(null); }
    }
    window[cbName] = function(response){
      try{
        if(response.status === "error") throw new Error("gviz error");
        const cols = response.table.cols.map(c=> c.label || c.id);
        const rows = response.table.rows.map(r=> r.c.map(c=> c ? (c.f !== undefined && c.f !== null ? c.f : c.v) : ""));
        finish(true, null, rowsToTasksFromCols(cols, rows));
      }catch(e){ finish(false, e.message); }
    };
    const script = document.createElement("script");
    script.src = fullUrl;
    script.onerror = ()=> finish(false, "script error");
    document.head.appendChild(script);
  });
}

async function fetchSprint(name, url){
  const proxies = [
    "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
    "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
  ];
  let lastErr = null;

  // Strategy 1: direct fetch (works if Google ever serves CORS headers)
  try{
    const text = await tryFetchText(url);
    SPRINTS[name] = rowsToTasks(parseCSV(text));
    delete fetchErrors[name];
    return true;
  }catch(err){ lastErr = err; }

  // Strategy 2 & 3: fetch through public CORS relays
  for(const proxyUrl of proxies){
    try{
      const text = await tryFetchText(proxyUrl);
      SPRINTS[name] = rowsToTasks(parseCSV(text));
      delete fetchErrors[name];
      return true;
    }catch(err){ lastErr = err; }
  }

  // Strategy 4: gviz JSONP (bypasses CORS via <script> tag), only if URL looks like a sheet link
  try{
    const base = url.split("/pub")[0].split("/gviz")[0];
    const gid = (url.match(/gid=(\d+)/) || [])[1];
    const gvizAttempt = base + "/gviz/tq?tqx=out:json" + (gid ? "&gid="+gid : "");
    const tasks = await gvizFallback(name, gvizAttempt);
    if(tasks){
      SPRINTS[name] = tasks;
      delete fetchErrors[name];
      return true;
    }
  }catch(err){ lastErr = err; }

  console.error("Error cargando "+name, lastErr);
  fetchErrors[name] = (lastErr && lastErr.message) || "No se pudo cargar la hoja";
  return false;
}

async function loadAllSprints(){
  const jobs = SPRINT_NAMES
    .filter(n => SPRINT_SOURCES[n])
    .map(n => fetchSprint(n, SPRINT_SOURCES[n]));
  await Promise.all(jobs);
}

const STATUSES = ["Backlog","Selected for Development","In Progress","Done"];
const STATUS_COLOR = {Backlog:"backlog",             "Selected for Development":"selected", "In Progress":"progress", Done:"done"};
const PRIORITY_COLOR = {Highest:"var(--danger)", High:"var(--progress)", Medium:"var(--selected)", Low:"var(--backlog)"};

function hrs(sec){ return Math.round((sec/3600)*10)/10; }
function fmtH(sec){ const h = hrs(sec); return (h % 1 === 0 ? h.toFixed(0) : h.toFixed(1)) + "h"; }
function initials(name){
  if(!name) return "—";
  return name.split(" ").filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("");
}

let state = { search:"", assignee:"", priority:"", view:"board", sprint:"overview" };

function currentData(){
  if(state.sprint === "overview"){
    return SPRINT_NAMES.flatMap(n => SPRINTS[n]);
  }
  return SPRINTS[state.sprint] || [];
}

function filtered(){
  return currentData().filter(t=>{
    if(state.assignee && (t.assignee||"Sin asignar") !== state.assignee) return false;
    if(state.priority && t.priority !== state.priority) return false;
    if(state.search){
      const q = state.search.toLowerCase();
      const hay = (t.key+" "+t.summary+" "+(t.assignee||"")).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderStats(){
  const data = currentData();
  const total = data.length;
  const done = data.filter(t=>t.status==="Done").length;
  const origSum = data.reduce((a,t)=>a+t.orig,0);
  const spentSum = data.reduce((a,t)=>a+t.spent,0);
  const remainSum = data.reduce((a,t)=>a+t.remaining,0);
  const pct = total ? Math.round((done/total)*100) : 0;

  const stats = [
    {label:"Subtareas", value:total, sub:done+" completadas"},
    {label:"Avance", value:pct+"%", sub:done+" de "+total},
    {label:"Estimación total", value:fmtH(origSum), sub:"trabajo original"},
    {label:"Tiempo registrado", value:fmtH(spentSum), sub:"vs. "+fmtH(origSum)+" estimado"},
    {label:"Restante", value:fmtH(remainSum), sub:"por completar"},
  ];
  document.getElementById("stats").innerHTML = stats.map(s=>
    `<div class="stat"><p class="label">${s.label}</p><p class="value">${s.value}</p><p class="sub">${s.sub}</p></div>`
  ).join("");
}

function renderStatus(){
  const data = currentData();
  const total = data.length;
  const doneH = data.filter(t=>t.status==="Done").reduce((a,t)=>a+t.orig,0);
  const backlogH = data.filter(t=>t.status==="Backlog").reduce((a,t)=>a+t.orig,0);
  const origSum = data.reduce((a,t)=>a+t.orig,0);
  const backlogPct = origSum ? backlogH/origSum : 0;
  const donePct = origSum ? doneH/origSum : 0;

  let level, label, detail;
  if(fetchErrors[state.sprint]){
    level = "risk"; label = "Error de conexión";
    detail = "No se pudo cargar la hoja (" + fetchErrors[state.sprint] + "). Verifica que siga publicada y compartida.";
  } else if(total === 0){
    level = "warn"; label = "Sin datos";
    detail = "Este sprint todavía no tiene tareas cargadas.";
  } else if(backlogPct > 0.35){
    level = "risk"; label = "En riesgo";
    detail = "Gran parte del trabajo sigue sin arrancar (" + Math.round(backlogPct*100) + "% en Backlog).";
  } else if(donePct >= 0.5){
    level = "ok"; label = "En buen camino";
    detail = Math.round(donePct*100) + "% del esfuerzo ya está completado.";
  } else {
    level = "warn"; label = "En progreso";
    detail = "Avance moderado, sin señales claras de bloqueo.";
  }

  document.getElementById("statusRow").innerHTML =
    `<span class="status-pill ${level}"><span class="dot"></span>${label}</span>
     <span class="status-detail">${detail}</span>`;
}

function renderInsight(){
  const data = currentData();
  const el = document.getElementById("insight");
  if(data.length === 0){
    el.innerHTML = `<span class="tag">Insight</span>Sin tareas todavía para generar un insight.`;
    return;
  }
  const byPerson = {};
  data.forEach(t=>{
    const name = t.assignee || "Sin asignar";
    byPerson[name] = byPerson[name] || {backlog:0,total:0,doneOver:0};
    byPerson[name].total += t.orig;
    if(t.status==="Backlog") byPerson[name].backlog += t.orig;
    if(t.status==="Done" && t.spent > t.orig) byPerson[name].doneOver += (t.spent - t.orig);
  });

  const names = Object.keys(byPerson);
  const topBacklog = names.reduce((a,b)=> byPerson[a].backlog > byPerson[b].backlog ? a : b);
  const overrunPerson = names.find(n=>byPerson[n].doneOver > 0);

  let text = byPerson[topBacklog].backlog > 0
    ? `<b>${topBacklog}</b> concentra ${fmtH(byPerson[topBacklog].backlog)} sin arrancar (Backlog), el bloque más grande de trabajo pendiente.`
    : `No hay trabajo pendiente en Backlog — buena señal para el cierre de este periodo.`;

  if(overrunPerson){
    const over = byPerson[overrunPerson].doneOver;
    text += ` Además, tareas completadas por <b>${overrunPerson}</b> tomaron ${fmtH(over)} más de lo estimado — vale la pena revisar esas estimaciones para tareas similares.`;
  }

  el.innerHTML = `<span class="tag">Insight</span>${text}`;
}

function renderWorkload(){
  const data = currentData();
  const people = {};
  data.forEach(t=>{
    const name = t.assignee || "Sin asignar";
    if(!people[name]) people[name] = {Backlog:0,"Selected for Development":0,"In Progress":0,Done:0,total:0};
    people[name][t.status] += t.orig;
    people[name].total += t.orig;
  });
  const names = Object.keys(people).sort((a,b)=>people[b].total-people[a].total);
  const max = names.length ? Math.max(...names.map(n=>people[n].total)) : 1;

  document.getElementById("wl-n").textContent = names.length + " personas";
  document.getElementById("workload").innerHTML = names.length ? names.map(name=>{
    const p = people[name];
    const width = (p.total/max)*100;
    const segs = STATUSES.map(s=>{
      if(!p[s]) return "";
      const w = (p[s]/p.total)*100;
      return `<div class="wl-seg" style="width:${w}%;background:var(--${STATUS_COLOR[s]})" title="${s}: ${fmtH(p[s])}"></div>`;
    }).join("");
    return `<div class="wl-row">
      <div class="wl-name">${name}</div>
      <div class="wl-bar" style="width:100%"><div style="width:${width}%;display:flex;height:100%;">${segs}</div></div>
      <div class="wl-total">${fmtH(p.total)}</div>
    </div>`;
  }).join("") : `<div class="empty">Sin datos</div>`;
}

function cardHtml(t){
  const av = t.assignee ? `<div class="avatar">${initials(t.assignee)}</div>` : `<div class="avatar unassigned">?</div>`;
  return `<div class="card" style="border-left-color:var(--${STATUS_COLOR[t.status]})">
    <div class="key">${t.key}</div>
    <div class="summary">${t.summary}</div>
    <div class="card-meta">
      ${av}
      <div class="meta-right">
        <span class="prio-dot" style="background:${PRIORITY_COLOR[t.priority]}" title="${t.priority}"></span>
        <span class="time-chip">${t.spent>0 ? fmtH(t.spent)+" / " : ""}${fmtH(t.orig)}</span>
      </div>
    </div>
  </div>`;
}

function renderBoard(){
  const data = filtered();
  document.getElementById("board").innerHTML = STATUSES.map(s=>{
    const items = data.filter(t=>t.status===s);
    return `<div class="col">
      <div class="col-head">
        <span class="name" style="color:var(--${STATUS_COLOR[s]})">${s}</span>
        <span class="count">${items.length}</span>
      </div>
      <div class="col-body">
        ${items.length ? items.map(cardHtml).join("") : `<div class="empty">Sin tareas</div>`}
      </div>
    </div>`;
  }).join("");
}

function renderPeople(){
  const data = filtered();
  const names = [...new Set(data.map(t=>t.assignee||"Sin asignar"))]
    .sort((a,b)=> (data.filter(t=>(t.assignee||"Sin asignar")===b).reduce((s,t)=>s+t.orig,0)) - (data.filter(t=>(t.assignee||"Sin asignar")===a).reduce((s,t)=>s+t.orig,0)));

  document.getElementById("people").innerHTML = names.map(name=>{
    const items = data.filter(t=>(t.assignee||"Sin asignar")===name);
    const av = name==="Sin asignar" ? `<div class="avatar unassigned">?</div>` : `<div class="avatar">${initials(name)}</div>`;
    return `<div class="person">
      <div class="person-head">${av}<span class="pname">${name}</span><span class="pcount">${items.length} tareas</span></div>
      <div class="person-body">${items.map(cardHtml).join("")}</div>
    </div>`;
  }).join("");
}

function renderAll(){
  renderBoard();
  renderPeople();
  document.getElementById("footerLine").textContent =
    "ELOPEP · " + (state.sprint==="overview" ? "Todos los sprints" : state.sprint) + " · " + filtered().length + " subtareas";
}

function renderSprintGrid(){
  document.getElementById("sprintGrid").innerHTML = SPRINT_NAMES.map(name=>{
    const data = SPRINTS[name];
    const total = data.length;
    const origSum = data.reduce((a,t)=>a+t.orig,0);
    const doneH = data.filter(t=>t.status==="Done").reduce((a,t)=>a+t.orig,0);
    const pct = origSum ? Math.round((doneH/origSum)*100) : 0;
    const empty = total === 0;
    return `<div class="sprint-card ${empty?'empty-sprint':''}" data-sprint="${name}">
      <p class="sname">${name}</p>
      <div class="sbar"><div class="sbar-fill" style="width:${pct}%"></div></div>
      <div class="smeta"><span>${empty ? "Sin datos" : pct+"% completado"}</span><span>${total} tareas</span></div>
    </div>`;
  }).join("");

  document.querySelectorAll(".sprint-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      selectSprint(card.dataset.sprint);
    });
  });
}

function renderTabs(){
  const tabs = ["overview", ...SPRINT_NAMES];
  document.getElementById("tabs").innerHTML = tabs.map(t=>{
    const label = t==="overview" ? "Overview" : t;
    return `<button class="tab ${state.sprint===t?'active':''}" data-tab="${t}">${label}</button>`;
  }).join("");
  document.querySelectorAll(".tab").forEach(btn=>{
    btn.addEventListener("click", ()=> selectSprint(btn.dataset.tab));
  });
}

function selectSprint(name){
  state.sprint = name;
  state.search = ""; state.assignee = ""; state.priority = "";
  const searchInput = document.getElementById("search");
  if(searchInput) searchInput.value = "";

  document.getElementById("pageTitle").textContent = name === "overview" ? "Overview" : "Sprint tracker";
  document.getElementById("overviewView").style.display = name === "overview" ? "block" : "none";
  document.getElementById("sprintView").style.display = name === "overview" ? "none" : "block";

  renderTabs();
  if(name === "overview"){
    renderSprintGrid();
  } else {
    refreshFilters();
    renderStats();
    renderStatus();
    renderInsight();
    renderWorkload();
    renderAll();
  }
}

function refreshFilters(){
  const data = currentData();
  const assignees = [...new Set(data.map(t=>t.assignee||"Sin asignar"))].sort();
  const selA = document.getElementById("filterAssignee");
  selA.innerHTML = `<option value="">Toda persona</option>` + assignees.map(a=>`<option value="${a}">${a}</option>`).join("");

  const priorities = [...new Set(data.map(t=>t.priority))];
  const order = {Highest:0,High:1,Medium:2,Low:3};
  priorities.sort((a,b)=>order[a]-order[b]);
  const selP = document.getElementById("filterPriority");
  selP.innerHTML = `<option value="">Toda prioridad</option>` + priorities.map(p=>`<option value="${p}">${p}</option>`).join("");
}

function setup(){
  document.getElementById("updated").textContent = "Cargando…";

  document.getElementById("search").addEventListener("input", e=>{ state.search = e.target.value; renderAll(); });
  document.getElementById("filterAssignee").addEventListener("change", e=>{ state.assignee = e.target.value; renderAll(); });
  document.getElementById("filterPriority").addEventListener("change", e=>{ state.priority = e.target.value; renderAll(); });

  const btnBoard = document.getElementById("btnBoard");
  const btnPeople = document.getElementById("btnPeople");
  btnBoard.addEventListener("click", ()=>{
    state.view = "board";
    btnBoard.classList.add("active"); btnPeople.classList.remove("active");
    document.getElementById("board").style.display = "grid";
    document.getElementById("people").style.display = "none";
  });
  btnPeople.addEventListener("click", ()=>{
    state.view = "people";
    btnPeople.classList.add("active"); btnBoard.classList.remove("active");
    document.getElementById("board").style.display = "none";
    document.getElementById("people").style.display = "flex";
  });

  document.getElementById("refreshBtn").addEventListener("click", async ()=>{
    document.getElementById("updated").textContent = "Actualizando…";
    await loadAllSprints();
    document.getElementById("updated").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX", {hour:"2-digit",minute:"2-digit"});
    selectSprint(state.sprint);
  });

  loadAllSprints().then(()=>{
    document.getElementById("updated").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX", {hour:"2-digit",minute:"2-digit"});
    selectSprint("overview");
  });
}

setup();
</script>
</body>
</html>
